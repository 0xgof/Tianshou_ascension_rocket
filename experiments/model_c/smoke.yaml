training:
  model_name: model_c
  run_name: model_c_smoke_from_yaml
  max_steps: 32
  max_epoch: 1
  step_per_epoch: 32
  step_per_collect: 32
  episode_per_test: 1
  repeat_per_collect: 1
  batch_size: 16
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  eps_clip: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  actor_network:
    hidden_sizes: [64, 64]
    activation: tanh
  critic_network:
    hidden_sizes: [64, 64]
    activation: tanh
  gaussian_policy:
    initial_log_std: 0.0
  training_display:
    enabled: false
    step_delay_seconds: 0.0
    width: 1100
    height: 820
    fps: 30
